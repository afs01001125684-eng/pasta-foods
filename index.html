    <style>
        :root { --main: #e41e26; --dark: #1a1a1a; --light: #f4f4f4; }
        body { font-family: 'Cairo', sans-serif; background: var(--light); margin: 0; }
        
        /* الهيدر الاحترافي */
        header { background: var(--dark); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        header h1 { margin: 0; font-size: 2rem; color: var(--main); }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .product-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; }
        .product-card img { width: 100%; height: 180px; border-radius: 10px; object-fit: cover; }
        .product-card h3 { margin: 10px 0; font-size: 1.1rem; }
        .price { color: var(--main); font-weight: 900; font-size: 1.2rem; }
        .id-badge { background: var(--main); color: white; padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        
        #cart-footer { position: fixed; bottom: 0; width: 100%; background: var(--main); color: white; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; overflow-y: auto; }
        .modal-content { background: white; width: 90%; max-width: 500px; margin: 50px auto; padding: 20px; border-radius: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        .btn-order { background: #25D366; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>

        <input type="text" id="address" placeholder="العنوان">
        <button class="btn-order" onclick="submit()">إرسال عبر واتساب 💬</button>
        <button onclick="toggleCart()" style="background:none; border:none; margin-top:10px; cursor:pointer;">إغلاق</button>
    </div>
</div>

        // يمكنك إضافة بقية المنتجات بنفس النمط
    ];

    let cart = [];
    const menuDiv = document.getElementById('menu');

    items.forEach(item => {
        menuDiv.innerHTML += `
            <div class="product-card">
                <span class="id-badge">#${item.id}</span>
                <img src="${item.img}">
                <h3>${item.name}</h3>
                <div class="price">${item.price} ج.م</div>
                <button onclick="addToCart(${item.id})" style="width:100%; padding:10px; margin-top:10px; cursor:pointer;">أضف للسلة</button>
            </div>
        `;
    });

    function addToCart(id) {
        cart.push(items.find(i => i.id === id));
        document.getElementById('count').innerText = cart.length;
        alert("تمت الإضافة!");
    }

    function toggleCart() {
        const modal = document.getElementById('modal');
        modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

    function submit() {
        const name = document.getElementById('name').value;
        const list = cart.map(i => i.name).join(', ');
        window.open(`https://wa.me/201001125684?text=طلب جديد من: ${name}%0Aالطلبات: ${list}`, '_blank');
    }
</script>

    let cart = [];

    function renderMenu() {
        const container = document.getElementById("menu-container");
        container.innerHTML = `<div class="menu-grid">` + menuItems.map(item => `
            <div class="card">
                <img src="${item.img}" alt="${item.name}">
                <h4>${item.name}</h4>
                <p><b>${item.price} ج.م</b></p>
                <button class="submit-btn" style="padding:5px;" onclick="addToCart(${item.id})">أضف للسلة</button>
            </div>
        `).join('') + `</div>`;
    }

    function addToCart(id) {
        const item = menuItems.find(i => i.id === id);
        cart.push(item);
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const list = document.getElementById("cart-items");
        const method = document.getElementById("delivery-method").value;
        const fee = (method === 'توصيل') ? 50 : 0;
        let total = fee;
        
        list.innerHTML = cart.map(i => {
            total += i.price;
            return `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${i.name}</span><span>${i.price} ج.م</span></div>`;
        }).join('');
        
        list.innerHTML += `<hr><b>رسوم التوصيل: ${fee} ج.م</b><br><b>الإجمالي: ${total} ج.م</b>`;
        document.getElementById("cart-count").innerText = cart.length;
        document.getElementById("cart-total").innerText = total;
    }

    function toggleCart() {
        const modal = document.getElementById("cart-modal");
        modal.style.display = (modal.style.display === "block") ? "none" : "block";
        updateCartDisplay();
    }

    function submitOrder() {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const method = document.getElementById("delivery-method").value;
        
        if(!name || !phone) return alert("يرجى إدخال البيانات!");
        
        const itemsList = cart.map(i => i.name).join(', ');
        const total = document.getElementById("cart-total").innerText;
        const msg = `طلب جديد:%0Aطريقة الاستلام: ${method}%0Aالاسم: ${name}%0Aالهاتف: ${phone}%0Aالعنوان: ${address}%0Aالطلبات: ${itemsList}%0Aالإجمالي: ${total} ج.م`;
        
        window.open(`https://wa.me/201001125684?text=${msg}`, '_blank');
    }

    renderMenu();
</script>
