    function getMenuData() {
        try {
            let saved = localStorage.getItem(MENU_MASTER_KEY);
            if (!saved) {
                localStorage.setItem(MENU_MASTER_KEY, JSON.stringify(fullDefaultCategories));
                return fullDefaultCategories;
            }
            let parsed = JSON.parse(saved);
            return (parsed && parsed.length > 0) ? parsed : fullDefaultCategories;
        } catch(e) {
            return fullDefaultCategories;
        }
    }

    function renderCustomerMenu() {
        let categories = getMenuData();
        let catBar = document.getElementById("categoryBar");
        let prodContainer = document.getElementById("productsContainer");

        catBar.innerHTML = categories.map((cat, idx) => `
            <div class="cat-item ${idx===0?'active':''}" onclick="scrollToCat(${idx})">${cat.category}</div>
        `).join('');

        prodContainer.innerHTML = categories.map((cat, catIdx) => `
            <div id="cat-sec-${catIdx}">
                <div class="section-header">
                    <h2>${cat.category}</h2>
                </div>
                <div class="items-grid">
                    ${cat.items ? cat.items.map(item => {
                        let count = cart[item.name] ? cart[item.name].qty : 0;
                        let btnHtml = count > 0 ? `
                            <div class="qty-controls-card">
                                <button class="qty-btn-card" onclick="changeQty('${item.name}',${item.price}, 1)">+</button>
                                <span class="qty-num-card">${count}</span>
                                <button class="qty-btn-card" onclick="changeQty('${item.name}',${item.price}, -1)">-</button>
                            </div>
                        ` : `
                            <button class="add-badge" onclick="changeQty('${item.name}',${item.price}, 1)">+</button>
                        `;

                        return `
                            <div class="product-card">
                                <img src="${item.img \vert{}\vert{} ''}" class="prod-img" loading="lazy" alt="${item.name}">
                                ${btnHtml}
                                <div class="prod-body">
                                    <div class="prod-title">${item.name}</div>
                                    <div class="prod-desc">${item.desc || ''}</div>
                                    <div class="price-box">
                                        <span class="curr-price">${item.price} ج.م</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') : ''}
                </div>
            </div>
        `).join('');
    }

    function scrollToCat(idx) {
        let sec = document.getElementById(`cat-sec-${idx}`);
        if(sec) sec.scrollIntoView({ behavior: 'smooth' });
    }

    function changeQty(name, price, delta) {
        if (!cart[name]) {
            if (delta > 0) cart[name] = { name, price, qty: delta };
        } else {
            cart[name].qty += delta;
            if (cart[name].qty <= 0) delete cart[name];
        }
        renderCustomerMenu();
        updateCartBar();
    }

    function updateCartBar() {
        let bar = document.getElementById("bottomCartBar");
        let keys = Object.keys(cart);
        if (keys.length === 0) {
            bar.style.display = "none";
            return;
        }
        bar.style.display = "block";
        let totalItemsCount = keys.reduce((sum, k) => sum + cart[k].qty, 0);
        document.getElementById("cartCount").innerText = totalItemsCount;
        let subtotal = keys.reduce((sum, k) => sum + (cart[k].price * cart[k].qty), 0);
        document.getElementById("cartTotalPrice").innerText = `${subtotal.toFixed(2)} ج.م`;
    }

    function toggleCart() {
        let modal = document.getElementById("modal");
        modal.style.display = modal.style.display === "block" ? "none" : "block";
        renderCartModal();
    }

    function renderCartModal() {
        let list = document.getElementById("cartItemsList");
        let keys = Object.keys(cart);
        if(keys.length === 0) {
            list.innerHTML = "<p style='text-align:center; color:#777;'>السلة فارغة حالياً</p>";
            return;
        }
        let subtotal = keys.reduce((sum, k) => sum + (cart[k].price * cart[k].qty), 0);
        let total = subtotal + deliveryFee;

        list.innerHTML = keys.map(k => `
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                <span>• ${cart[k].name} × ${cart[k].qty}</span>
                <span><b>${(cart[k].price * cart[k].qty).toFixed(2)} ج.م</b></span>
            </div>
        `).join('') + `
            <hr style="margin:15px 0;">
            <p>خدمة التوصيل: ${deliveryFee} ج.م</p>
            <p style="font-size:18px; font-weight:800; color:var(--talabat-main); margin-top:5px;">الإجمالي: ${total.toFixed(2)} ج.م</p>
        `;
    }

    function getGPSLocation() {
        const status = document.getElementById("locationStatus");
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            document.getElementById("custLocationMap").value = `https://www.google.com/maps?q=${lat},${lng}`;
            status.innerHTML = `✅ تم تحديد موقعك`;
            status.style.color = "green";
        });
    }

    function processOrder() {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        let keys = Object.keys(cart);
        if(!name || !phone || !address || keys.length === 0) {
            alert("من فضلك ادخل بيانات التوصيل وأضف منتجات للسلة");
            return;
        }
        let subtotal = keys.reduce((sum, k) => sum + (cart[k].price * cart[k].qty), 0);
        let total = subtotal + deliveryFee;

        let ordersHistory = JSON.parse(localStorage.getItem(ORDERS_MASTER_KEY) || "[]");
        ordersHistory.unshift({
            id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
            date: new Date().toLocaleString("ar-EG"),
            customer_name: name,
            phone: phone,
            address: address,
            location_url: document.getElementById("custLocationMap").value,
            total: total,
            items: keys.map(k => cart[k])
        });
        localStorage.setItem(ORDERS_MASTER_KEY, JSON.stringify(ordersHistory));

        window.open(`https://wa.me/201001125684?text=${encodeURIComponent('طلب جديد من باستا فود 🍝\nالعميل: ' + name + '\nالهاتف: ' + phone + '\nالإجمالي: ' + total.toFixed(2) + ' ج.م')}`, '_blank');
        setTimeout(() => window.location.reload(), 1000);
    }

    renderCustomerMenu();
</script>
</body>
</html>
