<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta Food - باستا فود</title>
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-gradient-to-r from-red-600 to-amber-500 text-white text-center py-8 shadow-md">
        <h1 class="text-3xl md:text-4xl font-extrabold">Pasta Food - باستا فود</h1>
        <p class="text-sm md:text-base mt-2 opacity-90">أقوى مكرونات وسندوتشات في فيصل - التوصيل متاح لأول فيصل</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- Navigation Menu Sections -->
        <div class="flex overflow-x-auto py-2 mb-6 gap-2 no-scrollbar border-b border-gray-200">
            <button onclick="filterSection('all')" class="sec-btn bg-red-600 text-white px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow">الكل</button>
            <button onclick="filterSection('offers')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🔥 العروض الخاصة</button>
            <button onclick="filterSection('meals')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🍗 الوجبات</button>
            <button onclick="filterSection('penne')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🍝 مكرونة بينا</button>
            <button onclick="filterSection('spaghetti')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🍜 الإسباجيتي</button>
            <button onclick="filterSection('sandwiches')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🥪 السندوتشات</button>
            <button onclick="filterSection('bechamel')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🥛 البشاميل</button>
            <button onclick="filterSection('burger')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🍔 البرجر</button>
            <button onclick="filterSection('hawawshi')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🫓 الحواوشي</button>
            <button onclick="filterSection('drinks')" class="sec-btn bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm hover:bg-gray-50">🥤 المشروبات</button>
        </div>

        <!-- Menu Items Grid -->
        <div id="menu-container" class="grid gap-4 md:grid-cols-2">
            <!-- Items inject dynamically -->
        </div>

        <!-- Cart Preview Fixed Footer -->
        <div id="cart-footer" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-4 hidden z-50">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div>
                    <span class="text-gray-600 text-sm">إجمالي السلة:</span>
                    <span id="cart-total" class="text-xl font-bold text-red-600 block">0 ج.م</span>
                </div>
                <button onclick="openOrderModal()" class="bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-700 hover:to-amber-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg flex items-center gap-2 transition duration-200">
                    <span>تأكيد الطلب الآن</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Order Information Modal -->
        <div id="order-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                <button onclick="closeOrderModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">بيانات العميل والتوصيل</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">الاسم الكريم:</label>
                        <input id="client-name" type="text" placeholder="اكتب اسمك هنا" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">رقم الموبايل للتواصل:</label>
                        <input id="client-phone" type="tel" placeholder="رقم الموبايل" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">العنوان بالتفصيل (أول فيصل والمناطق المجاورة):</label>
                        <textarea id="client-address" rows="3" placeholder="المنطقة، اسم الشارع، رقم العمارة والدور" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
                    </div>
                    <button onclick="sendOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md flex items-center justify-center gap-2 mt-2 transition">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.517 2.266 2.27 3.51 5.284 3.508 8.49-.005 6.66-5.341 11.997-11.953 11.997-2.005-.001-3.973-.503-5.714-1.458L0 24zm6.49-3.993l.366.218c1.543.917 3.31 1.4 5.1 1.4 5.474 0 9.928-4.45 9.933-9.925.002-2.653-1.03-5.147-2.905-7.025C17.166 2.8 14.67 1.766 12.013 1.766c-5.479 0-9.934 4.453-9.938 9.93-.001 1.77.464 3.5 1.345 5.029l.24.417-.994 3.633 3.72-.976zm11.385-6.753c-.303-.151-1.793-.884-2.072-.986-.278-.101-.482-.151-.685.151-.203.303-.787.986-.965 1.188-.178.203-.355.228-.658.077-.303-.152-1.28-.472-2.438-1.506-.901-.804-1.51-1.796-1.687-2.1-.178-.303-.019-.467.133-.617.136-.135.303-.354.455-.531.152-.177.203-.303.303-.506.101-.203.051-.38-.025-.531-.076-.152-.685-1.65-.938-2.26-.247-.594-.498-.513-.685-.523-.178-.01-.38-.012-.583-.012-.203 0-.533.076-.813.38-.28.303-1.066 1.039-1.066 2.532s1.092 2.939 1.244 3.141c.152.203 2.15 3.284 5.21 4.602.727.314 1.295.502 1.737.643.73.232 1.394.199 1.918.121.583-.087 1.793-.733 2.047-1.442.254-.709.254-1.317.178-1.442-.076-.127-.279-.203-.583-.354z"/></svg>
                        <span>إرسال الطلب عبر الواتساب</span>
                    </button>

        </div>

                        <div class="mt-4 flex items-center justify-end gap-2">
                            ${qty > 0 ? `
                                <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-bold flex items-center justify-center">-</button>
                                <span class="font-bold text-gray-800 w-6 text-center">${qty}</span>
                                <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-full bg-red-600 text-white hover:bg-red-700 font-bold flex items-center justify-center">+</button>
                            ` : `
                                <button onclick="updateQty(${item.id}, 1)" class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 transition">
                                    <span>إضافة</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                                    </svg>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        // Filter Sections
        function filterSection(section) {
            // Update Active Buttons
            document.querySelectorAll('.sec-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-red-600', 'text-white');

            if (section === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.section === section);
                renderMenu(filtered);
            }
        }

        // Update Cart Quantity
        function updateQty(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] <= 0) delete cart[id];
            
            updateCartUI();
            
            // Re-render to show updated quantities
            const activeBtn = document.querySelector('.sec-btn.bg-red-600');
            if (activeBtn) {
                const txt = activeBtn.innerText;
                if (txt.includes('الكل')) renderMenu(menuItems);
                else if (txt.includes('العروض')) filterSection('offers');
                else if (txt.includes('الوجبات')) filterSection('meals');
                else if (txt.includes('بينا')) filterSection('penne');
                else if (txt.includes('الإسباجيتي')) filterSection('spaghetti');
                else if (txt.includes('السندوتشات')) filterSection('sandwiches');
                else if (txt.includes('البشاميل')) filterSection('bechamel');
                else if (txt.includes('البرجر')) filterSection('burger');
                else if (txt.includes('الحواوشي')) filterSection('hawawshi');
                else if (txt.includes('المشروبات')) filterSection('drinks');
            } else {
                renderMenu(menuItems);
            }
        }

        // Calculate and Update Cart UI
        function updateCartUI() {
            let total = 0;
            let itemsCount = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                total += item.price * cart[id];
                itemsCount += cart[id];
            }

            const footer = document.getElementById('cart-footer');
            if (itemsCount > 0) {
                footer.classList.remove('hidden');
                document.getElementById('cart-total').innerText = `${total} ج.م`;
            } else {
                footer.classList.add('hidden');
            }
        }

        // Modal Controls
        function openOrderModal() {
            document.getElementById('order-modal').classList.remove('hidden');
        }
        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        // Send Order to WhatsApp with Custom Formatting
        function sendOrderToWhatsApp() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const address = document.getElementById('client-address').value.trim();

            if (!name || !phone || !address) {
                alert('من فضلك املأ جميع خانات التوصيل (الاسم، الموبايل، العنوان)!');
                return;
            }

            let orderText = `*طلب جديد من باستا فود 🍝*\n\n`;
            orderText += `*العميل:* ${name}\n`;
            orderText += `*رقم التواصل:* ${phone}\n`;
            orderText += `*العنوان بالتفصيل:* ${address}\n\n`;
            orderText += `*الأصناف المطلوبة:*\n`;

            let total = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                const itemTotal = item.price * cart[id];
                total += itemTotal;
                orderText += `▪️ ${item.name} (عدد ${cart[id]}) -> ${itemTotal} ج.م\n`;
            }

            orderText += `\n*إجمالي الحساب:* ${total} ج.م\n`;
            orderText += `_تمنياتنا لكم بوجبة شهية ولذيذة!_ 😋`;

            const whatsappNumber = "201001125684"; // Corrected WhatsApp Number format for Web API
            const encodedText = encodeURIComponent(orderText);
            const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodedText}`;

            window.open(url, '_blank');
            closeOrderModal();
        }

        // Initial Load
        renderMenu(menuItems);
    </script>
</body>
</html>
