<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باستا فود - Pasta Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --talabat-green: #00A699; --text-dark: #333; --light-grey: #f4f4f4; }
        body { font-family: 'Cairo', sans-serif; background: #fff; margin: 0; color: var(--text-dark); }
        
        /* تصميم يشبه طلبات */
        header { padding: 20px; border-bottom: 4px solid var(--light-grey); text-align: center; }
        .menu-container { max-width: 800px; margin: 20px auto; padding: 10px; }
        
        .item-card { 
            display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee;
            transition: 0.3s; cursor: pointer;
        }
        .item-card:hover { background: #fafafa; }
        .item-card img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; margin-left: 15px; }
        .item-info { flex-grow: 1; }
        .item-info h3 { margin: 0; font-size: 1.1rem; }
        .item-info .price { color: #666; font-weight: 700; margin-top: 5px; }
        
        .add-btn { 
            background: #fff; border: 2px solid var(--talabat-green); color: var(--talabat-green);
            padding: 8px 20px; border-radius: 25px; font-weight: 700; transition: 0.3s;
        }
        .add-btn:hover { background: var(--talabat-green); color: #fff; }

        /* سلة طلبات */
        #cart-bar { 
            position: fixed; bottom: 0; width: 100%; background: var(--talabat-green);
            color: #fff; padding: 15px; text-align: center; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>باستا فود 🍝</h1>
    <p>توصيل سريع - جودة عالية</p>
</header>

<div class="menu-container" id="menu"></div>

<div id="cart-bar" onclick="toggleCart()">🛒 عرض السلة (<span id="count">0</span>)</div>

<!-- (نفس الـ Modal والـ JavaScript السابقين لضمان عمل السلة) -->
<script>
    // بياناتك كما هي
    const menu = [ /* ضع مصفوفتك هنا */ ];
    
    // إضافة زر "أضف" بستايل طلبات
    function render() {
        document.getElementById("menu").innerHTML = menu.map(item => `
            <div class="item-card">
                <img src="${item.img}">
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <div class="price">${item.price} ج.م</div>
                </div>
                <button class="add-btn" onclick="addToCart(${item.id})">إضافة +</button>
            </div>
        `).join('');
    }
    // ... باقي دوال الـ JavaScript (addToCart, toggleCart, sendWhatsApp)
</script>
</body>
</html>
