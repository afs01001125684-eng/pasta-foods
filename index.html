<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pasta Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff3e6c; }
        body { font-family: 'Cairo', sans-serif; background: #f9f9f9; margin: 0; padding-bottom: 80px; }
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 2px solid #eee; }
        header h1 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        
        .cat-header { padding: 15px 20px; font-weight: bold; color: #555; }
        
        .product { background: white; margin: 0 15px 10px 15px; padding: 15px; border-radius: 15px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product img { width: 60px; height: 60px; border-radius: 10px; margin-left: 15px; object-fit: cover; }
        .info { flex-grow: 1; }
        .name { font-weight: bold; }
        .price { color: var(--accent); font-size: 0.9rem; }
        
        .qty-box { display: flex; align-items: center; gap: 10px; border: 1px solid #eee; padding: 5px; border-radius: 20px; }
        .btn-qty { border: none; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        
        #footer { position: fixed; bottom: 0; width: 100%; background: var(--accent); color: white; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header><h1>PASTA FOOD</h1></header>

<div id="menu"></div>

<div id="footer" onclick="sendOrder()">إتمام الطلب (الإجمالي: <span id="total">0</span> ج.م)</div>

<script>
    const data = {
        "المكرونات": [
            {id: 1, name: "مكرونة موتزاريلا", price: 135, img: "https://images.deliveryhero.io/image/talabat/MenuItems/طاجن_موتزريلا_فلفل_و_زيتو639053128470267368.jpg"},
            {id: 2, name: "مكرونة بالسجق", price: 95, img: "https://images.deliveryhero.io/image/global-menu-service/HF_EG/vendor/787003/product/2725505867/c9d30231-ab07-42fb-980e-0af543945428.jpg"}
        ],
        "الساندوتشات": [
            {id: 3, name: "كبدة بالرده", price: 120, img: "https://images.deliveryhero.io/image/global-menu-service/HF_EG/vendor/787003/product/3215609888/9d1f8bc5-3466-4157-97a6-d190721280f3.jpg"},
            {id: 4, name: "استربس", price: 180, img: "https://images.deliveryhero.io/image/talabat/MenuItems/ساندوتش_استربس639053112270881730.jpg"}
        ]
    };

    let cart = {};

    function render() {
        const menu = document.getElementById('menu');
        for(let cat in data) {
            menu.innerHTML += `<div class="cat-header">${cat}</div>`;
            data[cat].forEach(item => {
                menu.innerHTML += `
                    <div class="product">
                        <img src="${item.img}">
                        <div class="info">
                            <div class="name">${item.name}</div>
                            <div class="price">${item.price} ج.م</div>
                        </div>
                        <div class="qty-box">
                            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}">0</span>
                            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }
    }

    function changeQty(id, val) {
        if(!cart[id]) cart[id] = 0;
        cart[id] = Math.max(0, cart[id] + val);
        document.getElementById(`qty-${id}`).innerText = cart[id];
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;
        Object.keys(cart).forEach(id => {
            let item = Object.values(data).flat().find(i => i.id == id);
            total += item.price * cart[id];
        });
        document.getElementById('total').innerText = total;
    }

    function sendOrder() {
        alert("سيتم إرسال طلبك عبر واتساب...");
        // يمكنك إضافة كود الربط بالواتساب هنا
    }

    render();
</script>
</body>
</html>
