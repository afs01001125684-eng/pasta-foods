            display: flex;

            height: 180px;

            background: #eee;
        }

        .menu-item img { 
            width: 100%; 
            height: 100%;

            transition: var(--transition);
        }

        .menu-item:hover img {

        {"id": 49, "name": "بيبسي", "price": 20, "img": "https://images.deliveryhero.io/image/talabat/MenuItems/بيبسي639053109132004868.jpg"},
        {"id": 50, "name": "مياه معدنية", "price": 7, "img": "https://images.deliveryhero.io/image/talabat/MenuItems/مياه_معدنيه639053129396132874.jpg"}
    ];

    function renderMenu() {
        const container = document.getElementById("menu-container");
        container.innerHTML = `<div class="menu-grid">` + menuItems.map(item => `
            <div class="menu-item">
                <div class="image-container">
                    <img src="${item.img}" alt="${item.name}">
                </div>
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <div class="price-tag">${item.price}<span>ج.م</span></div>
                    <button class="order-btn" onclick="addToCart(${item.id})">أضف للسلة</button>
                </div>
            </div>
        `).join('') + `</div>`;
    }

    function addToCart(id) {
        const item = menuItems.find(i => i.id === id);
        cart.push(item);
        updateCartDisplay();
    }

    function updateCartDisplay() {
        document.getElementById("cart-count").innerText = cart.length;
        const total = cart.reduce((sum, i) => sum + i.price, 0);
        document.getElementById("cart-total").innerText = total;
    }

    function toggleCart() {
        const modal = document.getElementById("cart-modal");
        modal.style.display = (modal.style.display === "block") ? "none" : "block";
        const itemsDiv = document.getElementById("cart-items");
        itemsDiv.innerHTML = cart.map((i, index) => `
            <div class="cart-item">
                <span class="cart-item-name">${i.name}</span>
                <span class="cart-item-price">${i.price} ج.م</span>
            </div>
        `).join('');
        if(cart.length === 0) itemsDiv.innerHTML = "<p style='text-align:center; color:#777;'>السلة فارغة حالياً</p>";
    }

    function submitOrder() {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        
        if(!name || !phone || !address) return alert("يرجى ملء جميع البيانات لإكمال الطلب!");
        if(cart.length === 0) return alert("سلتك فارغة، يرجى إضافة وجبات أولاً!");

        const itemsList = cart.map(i => i.name).join(', ');
        const total = cart.reduce((sum, i) => sum + i.price, 0);
        
        const message = `طلب جديد من الموقع 🍕\n\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nالطلبات:\n- ${itemsList}\n\nالإجمالي: ${total} ج.م`;
        
        const phoneNumber = "201001125684"; // <--- ضع رقمك هنا
        window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
    }

    renderMenu();
</script>
</body>
</html>
