        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; }
        .modal-content { background: white; width: 100%; max-width: 500px; margin: auto; height: 100vh; padding: 25px; overflow-y: auto; }
        .form-group input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; background: var(--light-bg); }
        .submit-btn { background: var(--talabat-main); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: 700; }

    let cart = [];

    function renderMenu() {
        document.getElementById("menu").innerHTML = menuItems.map(item => `
            <div class="item-card">
                <img src="${item.img}" class="item-image" loading="lazy">
                <div class="item-info"><h3>${item.name}</h3><p>${item.price} ج.م</p></div>
                <button class="add-btn" onclick="addToCart(${item.id})">إضافة +</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        cart.push(menuItems.find(i => i.id === id));
        document.getElementById("count").innerText = cart.length;
        updateTotal();
    }

    function updateTotal() {
        const subtotal = cart.reduce((sum, i) => sum + i.price, 0);
        document.getElementById("totalPrice").innerText = subtotal + deliveryFee;
    }

    function toggleCart() {
        const modal = document.getElementById("modal");
        const cartItemsList = document.getElementById("cart-items-list");
        
        if (modal.style.display === "block") {
            modal.style.display = "none";
        } else {
            modal.style.display = "block";
            const subtotal = cart.reduce((sum, i) => sum + i.price, 0);
            const total = subtotal + deliveryFee;
            
            cartItemsList.innerHTML = cart.map(i => `<p>• ${i.name} - ${i.price} ج.م</p>`).join('') + 
                                     `<hr style="margin:15px 0; border: 0; border-top: 1px solid #eee;">` +
                                     `<p><strong>رسوم التوصيل: ${deliveryFee} ج.م</strong></p>` +
                                     `<p style="font-size:1.3rem; font-weight:800; color:#FF5A00; margin-top:10px;">الإجمالي: ${total} ج.م</p>`;
        }
    }

    function processOrder() {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const email = document.getElementById("customerEmail").value;
        const subtotal = cart.reduce((sum, i) => sum + i.price, 0);
        const total = subtotal + deliveryFee;
        const orderDetails = cart.map(i => `${i.name} (${i.price} ج.م)`).join('\n');
        
        const whatsAppMsg = `طلب جديد من باستا فود 🍝\n\n👤 العميل: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${address}\n\n🛒 الطلبات:\n${orderDetails}\n\n🛵 رسوم التوصيل: ${deliveryFee} ج.م\n💰 الإجمالي: ${total} ج.م`;

        emailjs.send('service_a1b2c3d', 'template_8yhqwxa', {
            customer_name: name,
            order_details: orderDetails,
            delivery_fee: deliveryFee,
            total_amount: total
        }).then(() => alert("تم إرسال الفاتورة بنجاح!"));

        window.open(`https://wa.me/201001125684?text=${encodeURIComponent(whatsAppMsg)}`, '_blank');
    }

    renderMenu();
