<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pasta Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-color: #ff3e6c; --dark: #1a1a1a; }
        body { font-family: 'Tajawal', sans-serif; background: #f4f4f4; padding-bottom: 80px; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--main-color); }
        .category-title { background: #ddd; padding: 10px; margin-top: 20px; font-weight: bold; }
        .item-card { background: white; display: flex; padding: 10px; margin: 10px; border-radius: 10px; align-items: center; }
        .item-card img { width: 80px; height: 80px; border-radius: 8px; margin-left: 10px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: var(--main-color); color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
        
        #cart-footer { position: fixed; bottom: 0; width: 100%; background: var(--main-color); color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 999; }
    </style>
</head>
<body>

<header><h1>PASTA FOOD</h1></header>

<div id="menu-container"></div>

<div id="cart-footer">🛒 السلة: <span id="count">0</span> | الإجمالي: <span id="total">0</span> ج.م</div>

<script>
    const data = {
        "المكرونات": [
            {id: 1, name: "مكرونة موتزاريلا", price: 135, img: "https://images.deliveryhero.io/image/talabat/MenuItems/طاجن_موتزريلا_فلفل_و_زيتو639053128470267368.jpg"},
            {id: 2, name: "مكرونة بالسجق", price: 95, img: "https://images.deliveryhero.io/image/global-menu-service/HF_EG/vendor/787003/product/2725505867/c9d30231-ab07-42fb-980e-0af543945428.jpg"}
        ],
        "الساندوتشات": [
            {id: 3, name: "كبدة بالرده", price: 120, img: "https://images.deliveryhero.io/image/global-menu-service/HF_EG/vendor/787003/product/3215609888/9d1f8bc5-3466-4157-97a6-d190721280f3.jpg"},
            {id: 4, name: "استربس", price: 180, img: "https://images.deliveryhero.io/image/talabat/MenuItems/ساندوتش_استربس639053112270881730.jpg"}
        ]
    };

    let cart = {}; // لتخزين الطلبات بالكميات

    function renderMenu() {
        const container = document.getElementById('menu-container');
        for (let cat in data) {
            container.innerHTML += `<div class="category-title">${cat}</div>`;
            data[cat].forEach(item => {
                container.innerHTML += `
                    <div class="item-card">
                        <img src="${item.img}">
                        <div style="flex-grow:1">
                            <h3>${item.name}</h3>
                            <div class="price">${item.price} ج.م</div>
                        </div>
                        <div class="controls">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}">0</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }
    }

    function updateQty(id, change) {
        if (!cart[id]) cart[id] = 0;
        cart[id] = Math.max(0, cart[id] + change);
        document.getElementById(`qty-${id}`).innerText = cart[id];
        updateTotal();
    }

    function updateTotal() {
        let total = 0, count = 0;
        // هنا نقوم بحساب الإجمالي بناءً على مصفوفة البيانات
        Object.keys(cart).forEach(id => {
            let item = Object.values(data).flat().find(i => i.id == id);
            total += item.price * cart[id];
            count += cart[id];
        });
        document.getElementById('count').innerText = count;
        document.getElementById('total').innerText = total;
    }

    renderMenu();
</script>
</body>
</html>
