        .menu-item {
            background: white;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

            flex-direction: column;
            flex-grow: 1;
        }
        .item-name {
            font-size: 1.15rem;

            margin-bottom: 8px;
            color: var(--dark-color);
            line-height: 1.4;
        }
        .item-desc {

            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
            line-height: 1.5;
        }
        .item-footer {

            align-items: center;
            margin-top: auto;

        .item-price {

            font-weight: bold;
            color: var(--primary-color);

        .order-btn {

            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;

        // تجميع المنتجات حسب أقسامها وتوليد الصفحة تلقائياً
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("menu-container");
            
            // تجميع الأقسام الفريدة
            const sections = [...new Set(menuItems.map(item => item.section))];
            
            sections.forEach(secName => {
                // إنشاء عنوان القسم
                const title = document.createElement("h2");
                title.className = "section-title";
                title.innerText = secName;
                container.appendChild(title);
                
                // إنشاء شبكة المنتجات للقسم
                const grid = document.createElement("div");
                grid.className = "menu-grid";
                
                // فلترة وعرض المنتجات التابعة للقسم
                const secItems = menuItems.filter(item => item.section === secName);
                secItems.forEach(item => {
                    const itemCard = document.createElement("div");
                    itemCard.className = "menu-item";
                    
                    itemCard.innerHTML = `
                        <div class="item-img-container">
                            <img class="item-img" src="${item.img || 'https://via.placeholder.com/300x200?text=Pasta+Food'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Pasta+Food'">
                        </div>
                        <div class="item-details">
                            <h3 class="item-name">${item.name}</h3>
                            <p class="item-desc">${item.desc}</p>
                            <div class="item-footer">
                                <span class="item-price">${item.price} ج.م</span>
                                <button class="order-btn" onclick="orderItem('${item.name}', ${item.price})">اطلب الآن</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(itemCard);
                });
                
                container.appendChild(grid);
            });
        });

        // دالة الطلب البسيطة للتجربة
        function orderItem(name, price) {
            alert(`تم إضافة "${name}" بسعر ${price} ج.م لسلتك بنجاح!`);
        }
    </script>
