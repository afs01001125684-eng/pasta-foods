<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - باستا فود 👨‍🍳</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --talabat-main: #FF5A00; --text-dark: #191919; --light-bg: #f8f9fa; --border-color: #e5e5e5; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; color: var(--text-dark); padding: 15px; padding-bottom: 80px; }
        .container { max-width: 650px; margin: 0 auto; }
        
        .top-add-btn { background: #fff; border: 2px dashed var(--talabat-main); color: var(--talabat-main); padding: 14px; border-radius: 12px; width: 100%; font-weight: 800; text-align: center; cursor: pointer; margin-bottom: 15px; font-size: 16px; }
        .reset-btn { background: #fff3ec; border: 1px solid #ffd8c2; color: #d84315; padding: 8px; border-radius: 8px; width: 100%; font-weight: 700; text-align: center; cursor: pointer; margin-bottom: 20px; font-size: 13px; }

        .section-title { font-size: 18px; font-weight: 800; color: var(--talabat-main); margin: 20px 0 10px; }
        
        .order-card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        
        .category-card { background: #fff; border-radius: 14px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border-color); }
        .category-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .category-title { font-size: 17px; font-weight: 800; color: #222; }
        .category-info { font-size: 13px; color: #777; margin-top: 3px; }
        .category-actions { display: flex; align-items: center; gap: 8px; }
        .action-icon { background: #f0f0f0; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .action-icon-delete { background: #ffebee; color: #c62828; }
        
        .products-list { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px; display: block; }
        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; gap: 10px; cursor: pointer; }
        .product-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .product-info-box { flex-grow: 1; }
        .product-name { font-size: 14px; font-weight: 700; color: #222; }
        .product-desc { font-size: 11px; color: #777; margin-top: 2px; }
        .product-price-tag { font-size: 13px; font-weight: 800; color: var(--talabat-main); margin-top: 2px; }

        /* نافذة المودال */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; max-width: 600px; height: 92vh; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
        
        .image-picker-container { position: relative; width: 100%; height: 160px; border-radius: 14px; overflow: hidden; background: #eee; cursor: pointer; margin-bottom: 20px; border: 1px solid #ddd; }
        .image-picker-container img { width: 100%; height: 100%; object-fit: cover; }
        .camera-floating-btn { position: absolute; bottom: 12px; left: 12px; background: var(--talabat-main); color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 18px; }

        .custom-input-box { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 15px; background: #fff; }
        .custom-input-box label { display: block; font-size: 11px; color: #777; margin-bottom: 4px; font-weight: 700; }
        .custom-input-box input, .custom-input-box textarea, .custom-input-box select { width: 100%; border: none; outline: none; font-size: 14px; font-weight: 600; color: #222; background: transparent; }
        .custom-input-box textarea { resize: none; height: 60px; }

        .btn-confirm { background: var(--talabat-main); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--talabat-main); margin-bottom:15px;">👨‍🍳 لوحة إدارة مطعم باستا فود</h2>

    <!-- قسم الطلبات الواردة -->
    <div class="section-title">📦 الطلبات الواردة الحية</div>
    <div id="ordersListContainer">
        <p style="text-align:center; color:#777; margin-bottom:20px;">لا توجد طلبات جديدة حالياً.</p>
    </div>

    <hr style="margin:20px 0; border:none; border-top:1px solid #ddd;">

    <!-- قسم إدارة القائمة والأصناف -->
    <div class="section-title">📖 إدارة المنيو والأصناف</div>
    <button class="top-add-btn" onclick="openAddCategoryModal()">+ إضافة فئة جديدة</button>
    <button class="reset-btn" onclick="resetToDefaultMenu()">🔄 استرجاع القائمة الافتراضية كاملة (30 صنف)</button>
    <div id="adminCategoriesContainer"></div>
</div>

<!-- نافذة تعديل / إضافة صنف -->

                <div style="width:20px;"></div>
            </div>

            <div class="image-picker-container" onclick="document.getElementById('deviceImageInput').click()">

                <div class="camera-floating-btn">📷</div>
            </div>
            <input type="file" id="deviceImageInput" accept="image/*" style="display:none;" onchange="handleDeviceImageUpload(event)">
            <input type="hidden" id="modalImgUrl">

            <input type="hidden" id="editCatIdx" value="-1">
            <input type="hidden" id="editItemIdx" value="-1">

            <div class="custom-input-box">
                <label>اسم المنتج *</label>
                <input type="text" id="modalName" placeholder="أدخل اسم المنتج...">
            </div>

            <div class="custom-input-box">
                <label>الوصف التفصيلي *</label>
                <textarea id="modalDesc" placeholder="أدخل وصف مكونات المنتج..."></textarea>
            </div>

            <div class="custom-input-box">
                <label>الفئة / القسم</label>
                <select id="modalCategorySelect" style="width:100%; border:none; background:transparent; font-weight:700;"></select>
            </div>

            <div class="custom-input-box">
                <label>السعر (ج.م) *</label>
                <input type="number" step="0.01" id="modalPrice" placeholder="0.00">
            </div>
        </div>

        <div>
            <button class="btn-confirm" onclick="saveProduct()">تأكيد الحفظ</button>

</div>

    function getMenuData() {
        try {
            let saved = localStorage.getItem(MENU_MASTER_KEY);
            if (!saved) {
                localStorage.setItem(MENU_MASTER_KEY, JSON.stringify(fullDefaultCategories));
                return fullDefaultCategories;
            }
            let parsed = JSON.parse(saved);
            return (parsed && parsed.length > 0) ? parsed : fullDefaultCategories;
        } catch(e) {
            return fullDefaultCategories;
        }
    }

    function saveMenuData(data) {
        localStorage.setItem(MENU_MASTER_KEY, JSON.stringify(data));
    }

    function resetToDefaultMenu() {
        if(confirm("هل تريد استرجاع القائمة الافتراضية كاملة (30 صنف)؟")) {
            saveMenuData(fullDefaultCategories);
            renderAdmin();
            alert("تم الاسترجاع بنجاح!");
        }
    }

    function renderAdmin() {
        let data = getMenuData();
        let container = document.getElementById("adminCategoriesContainer");
        container.innerHTML = data.map((cat, catIdx) => `
            <div class="category-card">
                <div class="category-header" onclick="toggleCategory(this)">
                    <div>
                        <div class="category-title">${cat.category}</div>
                        <div class="category-info">${cat.items ? cat.items.length : 0} منتجات</div>
                    </div>
                    <div class="category-actions" onclick="event.stopPropagation()">
                        <button class="action-icon" onclick="openAddProductModal(${catIdx})">+</button>
                        <button class="action-icon" onclick="editCategoryName(${catIdx})">✏️</button>
                        <button class="action-icon action-icon-delete" onclick="deleteCategory(${catIdx})">🗑</button>
                    </div>
                </div>
                <div class="products-list">
                    ${cat.items && cat.items.length > 0 ? cat.items.map((item, itemIdx) => `
                        <div class="product-item" onclick="openEditProductModal(${catIdx}, ${itemIdx})">
                            <img src="${item.img || ''}" class="product-thumb" alt="${item.name}">
                            <div class="product-info-box">
                                <div class="product-name">${item.name}</div>
                                <div class="product-desc">${item.desc || ''}</div>
                                <div class="product-price-tag">${item.price} ج.م</div>
                            </div>
                            <div style="font-size:12px; color:var(--talabat-main); font-weight:700;">تعديل ✎</div>
                        </div>
                    `).join('') : '<p style="font-size:12px; color:#999; padding:10px 0;">لا توجد منتجات</p>'}
                </div>
            </div>
        `).join('');

        loadOrders();
    }

    function toggleCategory(headerEl) {
        let list = headerEl.nextElementSibling;
        list.style.display = (list.style.display === "none" || !list.style.display) ? "block" : "none";
    }

    function openAddCategoryModal() {
        let catName = prompt("أدخل اسم القسم الجديد:");
        if (catName) {
            let data = getMenuData();
            data.push({ category: catName, items: [] });
            saveMenuData(data);
            renderAdmin();
        }
    }

    function editCategoryName(catIdx) {
        let data = getMenuData();
        let newName = prompt("تعديل اسم القسم:", data[catIdx].category);
        if (newName) {
            data[catIdx].category = newName;
            saveMenuData(data);
            renderAdmin();
        }
    }

    function deleteCategory(catIdx) {
        if(confirm("هل أنت متأكد من حذف هذا القسم؟")) {
            let data = getMenuData();
            data.splice(catIdx, 1);
            saveMenuData(data);
            renderAdmin();
        }
    }

    function openEditProductModal(catIdx, itemIdx) {
        let data = getMenuData();
        let item = data[catIdx].items[itemIdx];
        populateCategorySelect(catIdx);

        document.getElementById("editCatIdx").value = catIdx;
        document.getElementById("editItemIdx").value = itemIdx;
        document.getElementById("modalName").value = item.name || "";
        document.getElementById("modalDesc").value = item.desc || "";
        document.getElementById("modalPrice").value = item.price || "";
        
        let img = item.img || "";
        document.getElementById("modalImagePreview").src = img;
        document.getElementById("modalImgUrl").value = img;
        
        document.getElementById("itemModal").style.display = "flex";
    }

    function openAddProductModal(catIdx) {
        populateCategorySelect(catIdx);
        document.getElementById("editCatIdx").value = catIdx;
        document.getElementById("editItemIdx").value = "-1";
        document.getElementById("modalName").value = "";
        document.getElementById("modalDesc").value = "";
        document.getElementById("modalPrice").value = "";
        document.getElementById("modalImagePreview").src = "";
        document.getElementById("modalImgUrl").value = "";
        document.getElementById("itemModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("itemModal").style.display = "none";
    }

    function populateCategorySelect(selectedIdx) {
        let data = getMenuData();
        let select = document.getElementById("modalCategorySelect");
        select.innerHTML = data.map((c, idx) => `
            <option value="${idx}" ${idx === selectedIdx ? 'selected' : ''}>${c.category}</option>
        `).join('');
    }

    function handleDeviceImageUpload(event) {
        let file = event.target.files[0];
        if (file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64 = e.target.result;
                document.getElementById("modalImagePreview").src = base64;
                document.getElementById("modalImgUrl").value = base64;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveProduct() {
        let name = document.getElementById("modalName").value.trim();
        let desc = document.getElementById("modalDesc").value.trim();
        let price = parseFloat(document.getElementById("modalPrice").value);
        let img = document.getElementById("modalImgUrl").value;
        let targetCatIdx = parseInt(document.getElementById("modalCategorySelect").value);
        let editCatIdx = parseInt(document.getElementById("editCatIdx").value);
        let editItemIdx = parseInt(document.getElementById("editItemIdx").value);

        if (!name || isNaN(price)) {
            alert("من فضلك أدخل الاسم والسعر على الأقل");
            return;
        }

        let data = getMenuData();
        let productObj = {
            id: editItemIdx === -1 ? Date.now() : data[editCatIdx].items[editItemIdx].id,
            name: name,
            desc: desc,
            price: price,
            img: img
        };

        if (editItemIdx !== -1) {
            data[editCatIdx].items.splice(editItemIdx, 1);
        }
        data[targetCatIdx].items.push(productObj);

        saveMenuData(data);
        renderAdmin();
        closeModal();
    }

    function loadOrders() {
        let orders = JSON.parse(localStorage.getItem(ORDERS_MASTER_KEY) || "[]");
        let container = document.getElementById("ordersListContainer");
        if(orders.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#777;">لا توجد طلبات جديدة حالياً.</p>`;
            return;
        }
        container.innerHTML = orders.map(o => `
            <div class="order-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span style="font-weight:800; color:var(--talabat-main);">${o.id}</span>
                    <span style="font-size:11px; color:#777;">${o.date}</span>
                </div>
                <p><b>العميل:</b> ${o.customer_name} | <b>الهاتف:</b> ${o.phone}</p>
                <p><b>العنوان:</b> ${o.address}</p>
                ${o.location_url ? `<p><a href="${o.location_url}" target="_blank" style="color:green; font-weight:700;">📍 فتح موقع العميل على الخريطة</a></p>` : ''}
                <hr style="margin:8px 0; border:none; border-top:1px dashed #ddd;">
                <p><b>الطلبات:</b></p>
                <ul style="padding-right:20px; font-size:12px; margin-bottom:5px;">
                    ${o.items.map(i => `<li>${i.name} × ${i.qty} (${(i.price * i.qty).toFixed(2)} ج.م)</li>`).join('')}
                </ul>
                <div style="display:flex; justify-content:space-between; font-weight:800; font-size:14px; margin-top:5px;">
                    <span>الإجمالي:</span>
                    <span style="color:var(--talabat-main);">${o.total.toFixed(2)} ج.م</span>
                </div>
            </div>
        `).join('');
    }

    renderAdmin();
</script>
</body>
</html>
