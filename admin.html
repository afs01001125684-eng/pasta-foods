<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة القائمة - باستا فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF5A00;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #666666;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Top Header */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .brand {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .status {
            background: #e6f4ea;
            color: #137333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* Action Bar */
        .action-bar {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-add {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        /* Categories & Items */
        .category-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 15px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 800;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-title {
            font-weight: 700;
            font-size: 15px;
        }

        .item-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-price {
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 4px;
            font-size: 14px;
        }

        .item-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 5px 10px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-edit { background: #e3f2fd; color: #1976d2; }
        .btn-delete { background: #ffebee; color: #d32f2f; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        .btn-save {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">🍝 باستا فود - لوحة التحكم</div>
        <div class="status">المطعم يستقبل الطلبات</div>
    </header>

    <div class="action-bar">
        <div>
            <h3 style="font-size:16px;">إدارة قائمة الطعام</h3>
            <p style="font-size:12px; color:var(--text-muted);">أضف وعدّل الأقسام والمنتجات بسهولة</p>
        </div>
        <button class="btn-add" onclick="openAddCatModal()">+ قسم جديد</button>
    </div>

    <div id="menuContainer"></div>
</div>

<!-- Modal Category -->
<div id="catModal" class="modal">
    <div class="modal-content">
        <h3 id="catModalTitle">إضافة قسم جديد</h3>
        <div class="form-group" style="margin-top:15px;">
            <label>اسم القسم</label>
            <input type="text" id="catNameInput" placeholder="مثال: الحواوشي، المكرونة">
        </div>
        <div class="modal-actions">
            <button class="btn-save" onclick="saveCategory()">حفظ</button>
            <button class="btn-cancel" onclick="closeModal('catModal')">إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal Item -->
<div id="itemModal" class="modal">
    <div class="modal-content">
        <h3 id="itemModalTitle">إضافة منتج جديد</h3>
        <input type="hidden" id="itemCatIndex">
        <input type="hidden" id="itemIndex">
        
        <div class="form-group" style="margin-top:15px;">
            <label>اسم المنتج</label>
            <input type="text" id="itemNameInput">
        </div>
        <div class="form-group">
            <label>الوصف</label>
            <textarea id="itemDescInput" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>السعر (ج.م)</label>
            <input type="number" id="itemPriceInput" step="0.5">
        </div>
        <div class="form-group">
            <label>رابط الصورة (URL)</label>
            <input type="text" id="itemImgInput">
        </div>
        <div class="modal-actions">
            <button class="btn-save" onclick="saveItem()">حفظ المنتج</button>
            <button class="btn-cancel" onclick="closeModal('itemModal')">إلغاء</button>
        </div>
    </div>
</div>

<script>
    var initialMenu = [
        {
            category: "الحواوشي",
            items: [
                { name: "حواوشي لحم بالموتزريلا", desc: "حواوشي لحم طازج ممزوج بالموتزريلا", price: 145, img: "https://via.placeholder.com/150" },
                { name: "حواوشي لحم بقري مخصوص", desc: "حواوشي لحم مميز", price: 85, img: "https://via.placeholder.com/150" }
            ]
        },
        {
            category: "مكرونة",
            items: [
                { name: "إسباجيتي بالطماطم", desc: "إسباجيتي بصلصة الطماطم", price: 45, img: "https://via.placeholder.com/150" }
            ]
        }
    ];

    var menuData = [];

    function loadData() {
        var savedData = localStorage.getItem("pasta_food_menu");
        if (savedData) {
            try {
                menuData = JSON.parse(savedData);
            } catch(e) {
                menuData = initialMenu;
            }
        } else {
            menuData = initialMenu;
        }
        renderMenu();
    }

    function saveData() {
        localStorage.setItem("pasta_food_menu", JSON.stringify(menuData));
        renderMenu();
    }

    function renderMenu() {
        var container = document.getElementById("menuContainer");
        container.innerHTML = "";

        if (menuData.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#777; margin-top:30px;'>لا توجد أقسام حالياً. اضغط على '+ قسم جديد' للبدء.</p>";
            return;
        }

        for (var i = 0; i < menuData.length; i++) {
            var cat = menuData[i];
            var catHtml = '<div class="category-card">' +
                '<div class="category-header">' +
                    '<span class="category-title">' + cat.category + ' (' + cat.items.length + ')</span>' +
                    '<div>' +
                        '<button class="btn-sm btn-edit" onclick="openAddItemModal(' + i + ')">+ إضافة وجبة</button> ' +
                        '<button class="btn-sm btn-delete" onclick="deleteCategory(' + i + ')">حذف القسم</button>' +
                    '</div>' +
                '</div>' +
                '<div class="items-list">';

            if (cat.items.length === 0) {
                catHtml += '<p style="font-size:12px; color:#999; text-align:center; padding:10px;">لا توجد منتجات في هذا القسم</p>';
            } else {
                for (var j = 0; j < cat.items.length; j++) {
                    var item = cat.items[j];
                    var imgSrc = item.img ? item.img : 'https://via.placeholder.com/150';
                    catHtml += '<div class="item-row">' +
                        '<img src="' + imgSrc + '" class="item-img" alt="صورة">' +
                        '<div class="item-info">' +
                            '<div class="item-title">' + item.name + '</div>' +
                            '<div class="item-desc">' + (item.desc || '') + '</div>' +
                            '<div class="item-price">' + item.price + ' ج.م</div>' +
                        '</div>' +
                        '<div class="item-actions">' +
                            '<button class="btn-sm btn-edit" onclick="openEditItemModal(' + i + ',' + j + ')">تعديل</button>' +
                            '<button class="btn-sm btn-delete" onclick="deleteItem(' + i + ',' + j + ')">حذف</button>' +
                        '</div>' +
                    '</div>';
                }
            }

            catHtml += '</div></div>';
            container.innerHTML += catHtml;
        }
    }

    /* Cat Functions */
    function openAddCatModal() {
        document.getElementById("catNameInput").value = "";
        document.getElementById("catModal").style.display = "flex";
    }

    function saveCategory() {
        var name = document.getElementById("catNameInput").value.trim();
        if (!name) return alert("من فضلك أدخل اسم القسم");
        menuData.push({ category: name, items: [] });
        saveData();
        closeModal("catModal");
    }

    function deleteCategory(catIndex) {
        if (confirm("هل تريد حذف هذا القسم بالكامل؟")) {
            menuData.splice(catIndex, 1);
            saveData();
        }
    }

    /* Item Functions */
    function openAddItemModal(catIndex) {
        document.getElementById("itemCatIndex").value = catIndex;
        document.getElementById("itemIndex").value = "-1";
        document.getElementById("itemNameInput").value = "";
        document.getElementById("itemDescInput").value = "";
        document.getElementById("itemPriceInput").value = "";
        document.getElementById("itemImgInput").value = "";
        document.getElementById("itemModalTitle").innerText = "إضافة منتج جديد";
        document.getElementById("itemModal").style.display = "flex";
    }

    function openEditItemModal(catIndex, itemIndex) {
        var item = menuData[catIndex].items[itemIndex];
        document.getElementById("itemCatIndex").value = catIndex;
        document.getElementById("itemIndex").value = itemIndex;
        document.getElementById("itemNameInput").value = item.name;
        document.getElementById("itemDescInput").value = item.desc || "";
        document.getElementById("itemPriceInput").value = item.price;
        document.getElementById("itemImgInput").value = item.img || "";
        document.getElementById("itemModalTitle").innerText = "تعديل المنتج";
        document.getElementById("itemModal").style.display = "flex";
    }

    function saveItem() {
        var catIndex = parseInt(document.getElementById("itemCatIndex").value);
        var itemIndex = parseInt(document.getElementById("itemIndex").value);
        var name = document.getElementById("itemNameInput").value.trim();
        var desc = document.getElementById("itemDescInput").value.trim();
        var price = parseFloat(document.getElementById("itemPriceInput").value);
        var img = document.getElementById("itemImgInput").value.trim();

        if (!name || isNaN(price)) return alert("يرجى كتابة اسم المنتج والسعر بشكل صحيح");

        var itemObj = { name: name, desc: desc, price: price, img: img };

        if (itemIndex === -1) {
            menuData[catIndex].items.push(itemObj);
        } else {
            menuData[catIndex].items[itemIndex] = itemObj;
        }

        saveData();
        closeModal("itemModal");
    }

    function deleteItem(catIndex, itemIndex) {
        if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            menuData[catIndex].items.splice(itemIndex, 1);
            saveData();
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    window.onload = loadData;
</script>
</body>
</html>
