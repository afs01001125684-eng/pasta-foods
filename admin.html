<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - باستا فود ⚙️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --main: #FF5A00; --bg: #f4f6f8; --dark: #1f2937; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--dark); padding: 15px; max-width: 900px; margin: auto; }
        
        header { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 20px; color: var(--main); }
        .btn-view-site { background: var(--main); color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 700; }

        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h2 { font-size: 16px; margin-bottom: 12px; border-bottom: 2px solid #eee; padding-bottom: 6px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; font-size: 13px; width: 100%; }
        button.action-btn { background: var(--main); color: #fff; border: none; font-weight: 800; cursor: pointer; }
        button.danger-btn { background: #dc2626; color: #fff; border: none; font-weight: 700; cursor: pointer; width: auto; padding: 4px 10px; font-size: 12px; border-radius: 6px; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        .img-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    </style>
</head>
<body>

<header>
    <h1>لوحة تحكم الأدمن 🛠️</h1>
    <a href="index.html" class="btn-view-site">العرض في الموقع ➔</a>
</header>

<!-- 1. إعدادات المتجر -->
<div class="card">
    <h2>⚙️ إعدادات التوصيل والحد الأدنى</h2>
    <div class="form-grid">
        <div>
            <label style="font-size:12px; font-weight:700;">رسوم التوصيل الأساسية (ج.م):</label>
            <input type="number" id="settingDeliveryFee">
        </div>
        <div>
            <label style="font-size:12px; font-weight:700;">حد التوصيل المجاني (ج.م):</label>
            <input type="number" id="settingFreeThreshold">
        </div>
    </div>
    <button class="action-btn" onclick="saveSettings()">حفظ الإعدادات</button>
</div>

<!-- 2. إضافة قسم جديد -->
<div class="card">
    <h2>📂 إضافة قسم جديد للمنيو</h2>
    <div class="form-grid">
        <input type="text" id="newCategoryName" placeholder="اسم القسم الجديد (مثال: المشويات 🥩)">
        <button class="action-btn" onclick="addCategory()">إضافة القسم</button>
    </div>
</div>

<!-- 3. إضافة صنف/وجبة جديدة -->
<div class="card">
    <h2>🍲 إضافة صنف جديد للمنيو</h2>
    <div class="form-grid">
        <select id="itemCategorySelect"></select>
        <input type="text" id="itemName" placeholder="اسم الوجبة/الصنف">
        <input type="number" id="itemPrice" placeholder="السعر (ج.م)">
        <input type="text" id="itemImg" placeholder="رابط صورة الوجبة (URL)">
    </div>
    <button class="action-btn" onclick="addItem()">إضافة الوجبة للمنيو</button>
</div>

<!-- 4. استعراض وحذف الأصناف -->
<div class="card">
    <h2>📋 قائمة أصناف المنيو الحالية</h2>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم الصنف</th>
                    <th>القسم</th>
                    <th>السعر</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="menuTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 5. سجل الطلبات الواردة -->
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>📜 سجل الطلبات الواردة</h2>
        <button class="danger-btn" onclick="clearOrders()">مسح السجل</button>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>اسم العميل</th>
                    <th>الهاتف</th>
                    <th>طريقة الدفع</th>
                    <th>الإجمالي</th>
                    <th>التفاصيل</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // القيم الافتراضية الأولية للمنيو
    const defaultMenu = [
        {
            category: "الوجبات (Meals) 🍗",
            items: [
                {id: 1, name: "وجبة أرز وربع فرخة فرن", price: 185.00, img: "https://talabat.dhmedia.io/image/global-menu-service/HF_EG/vendor/787003/product/a0a41598-90a0-42ca-ba10-6dd46705a9b4.jpg"},
                {id: 2, name: "مكرونة مع ربع فرخة فرن", price: 180.00, img: "https://talabat.dhmedia.io/image/global-menu-service/HF_EG/vendor/787003/product/027a9d71-523f-4190-8d7b-98c7cb4053e9.jpg"}
            ]
        },
        {
            category: "المكرونة (Pasta) 🍝",
            items: [
                {id: 22, name: "إسباجيتي بالطماطم", price: 45.00, img: "https://talabat.dhmedia.io/image/global-menu-service/HF_EG/vendor/1102296/product/891301a3-26a5-4f8c-92a6-480314e07bf1.jpg"}
            ]
        }
    ];

    let menu = JSON.parse(localStorage.getItem("pasta_menu")) || defaultMenu;
    let settings = JSON.parse(localStorage.getItem("pasta_settings")) || { deliveryFee: 50, freeThreshold: 250 };

    function initAdmin() {
        document.getElementById("settingDeliveryFee").value = settings.deliveryFee;
        document.getElementById("settingFreeThreshold").value = settings.freeThreshold;
        renderCategorySelect();
        renderMenuTable();
        renderOrdersTable();
    }

    function saveSettings() {
        settings.deliveryFee = parseFloat(document.getElementById("settingDeliveryFee").value) || 0;
        settings.freeThreshold = parseFloat(document.getElementById("settingFreeThreshold").value) || 0;
        localStorage.setItem("pasta_settings", JSON.stringify(settings));
        alert("✅ تم حفظ إعدادات التوصيل والحد الأدنى بنجاح!");
    }

    function renderCategorySelect() {
        const select = document.getElementById("itemCategorySelect");
        select.innerHTML = menu.map((cat, i) => `<option value="${i}">${cat.category}</option>`).join('');
    }

    function addCategory() {
        const catName = document.getElementById("newCategoryName").value.trim();
        if(!catName) return alert("يرجى كتابة اسم القسم!");
        
        menu.push({ category: catName, items: [] });
        saveMenu();
        document.getElementById("newCategoryName").value = "";
        alert("✅ تم إضافة القسم الجديد!");
    }

    function addItem() {
        const catIdx = document.getElementById("itemCategorySelect").value;
        const name = document.getElementById("itemName").value.trim();
        const price = parseFloat(document.getElementById("itemPrice").value);
        const img = document.getElementById("itemImg").value.trim() || "https://via.placeholder.com/150";

        if(!name || isNaN(price)) return alert("يرجى إدخال اسم الوجبة والسعر بشكل صحيح!");

        const newItem = { id: Date.now(), name, price, img };
        menu[catIdx].items.push(newItem);
        saveMenu();
        
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemImg").value = "";
        alert("✅ تمت إضافة الوجبة للمنيو!");
    }

    function deleteItem(catIdx, itemIdx) {
        if(confirm("هل أنت تأكد من حذف هذا الصنف؟")) {
            menu[catIdx].items.splice(itemIdx, 1);
            saveMenu();
        }
    }

    function saveMenu() {
        localStorage.setItem("pasta_menu", JSON.stringify(menu));
        renderCategorySelect();
        renderMenuTable();
    }

    function renderMenuTable() {
        const tbody = document.getElementById("menuTableBody");
        let html = "";
        menu.forEach((cat, catIdx) => {
            cat.items.forEach((item, itemIdx) => {
                html += `
                    <tr>
                        <td><img src="${item.img}" class="img-thumb"></td>
                        <td><b>${item.name}</b></td>
                        <td>${cat.category}</td>
                        <td>${item.price} ج.م</td>
                        <td><button class="danger-btn" onclick="deleteItem(${catIdx}, ${itemIdx})">حذف</button></td>
                    </tr>
                `;
            });
        });
        tbody.innerHTML = html || "<tr><td colspan='5' style='text-align:center;'>لا توجد أصناف حالياً</td></tr>";
    }

    function renderOrdersTable() {
        const tbody = document.getElementById("ordersTableBody");
        const orders = JSON.parse(localStorage.getItem("pasta_orders_history") || "[]");
        
        tbody.innerHTML = orders.reverse().map(o => `
            <tr>
                <td><b>${o.customer_name}</b></td>
                <td>${o.phone}</td>
                <td>${o.payment || 'كاش'}</td>
                <td><b>${o.total.toFixed(2)} ج.م</b></td>
                <td><small>${o.items.map(i=>i.name+' ('+i.qty+')').join(', ')}</small></td>
            </tr>
        `).join('') || "<tr><td colspan='5' style='text-align:center;'>لا توجد طلبات سابقة</td></tr>";
    }

    function clearOrders() {
        if(confirm("هل تريد مسح سجل الطلبات؟")) {
            localStorage.removeItem("pasta_orders_history");
            renderOrdersTable();
        }
    }

    initAdmin();
</script>
</body>
</html>
