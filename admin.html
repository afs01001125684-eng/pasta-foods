<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الأدمن 👨‍🍳</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --talabat-main: #FF5A00; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .btn { background: var(--talabat-main); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; margin-bottom: 15px; }
        .order-box, .cat-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #ddd; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: #fff; width: 100%; max-width: 600px; height: 85vh; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; overflow-y: auto; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--talabat-main); text-align:center; margin-bottom:15px;">لوحة تحكم الأدمن 👨‍🍳</h2>
    
    <h3>📦 الطلبات الحية الواردة:</h3>
    <div id="ordersContainer">لا توجد طلبات حتى الآن</div>

    <hr style="margin:20px 0;">

    <h3>📖 إدارة المنيو (الأسعار، الوصف، والصور):</h3>
    <button class="btn" onclick="openModal(0, -1)">+ إضافة صنف جديد</button>
    <div id="adminMenuContainer"></div>
</div>

<div id="itemModal" class="modal">
    <div class="modal-content">
        <h3>تعديل / إضافة صنف</h3>
        <input type="hidden" id="editCat">
        <input type="hidden" id="editItem">
        
        <label>اسم الصنف</label>
        <input type="text" id="mName">
        
        <label>الوصف</label>
        <textarea id="mDesc"></textarea>
        
        <label>السعر (ج.م)</label>
        <input type="number" id="mPrice">
        
        <label>صورة الصنف (ارفع من الجهاز)</label>
        <input type="file" accept="image/*" onchange="uploadImg(event)">
        <input type="hidden" id="mImg">
        <img id="imgPreview" style="width:80px; height:80px; object-fit:cover; display:block; margin-bottom:10px;">

        <button class="btn" onclick="saveItem()">حفظ الصنف</button>
        <button class="btn" style="background:#777" onclick="document.getElementById('itemModal').style.display='none'">إلغاء</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "pasta_db_master_v1";

    function loadAdmin() {
        let orders = JSON.parse(localStorage.getItem("pasta_orders_master_v1") || "[]");
        let oCont = document.getElementById("ordersContainer");
        if(orders.length === 0) {
            oCont.innerHTML = "<p style='color:#777;'>لا توجد طلبات حتى الآن</p>";
        } else {
            oCont.innerHTML = orders.map(o => `
                <div class="order-box">
                    <b>طلب: ${o.id}</b> - ${o.date}<br>
                    العميل: ${o.name} (${o.phone})<br>
                    العنوان: ${o.address}<br>
                    <b>الإجمالي: ${o.total} ج.م</b>
                </div>
            `).join('');
        }

        let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        let mCont = document.getElementById("adminMenuContainer");
        mCont.innerHTML = data.map((cat, cIdx) => `
            <div class="cat-box">
                <b>${cat.category}</b>
                ${cat.items ? cat.items.map((item, iIdx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; border-top:1px solid #eee; padding-top:6px;">
                        <span>${item.name} (${item.price} ج.م)</span>
                        <button onclick="openModal(${cIdx},${iIdx})" style="background:#222; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">تعديل</button>
                    </div>
                `).join('') : ''}
            </div>
        `).join('');
    }

    function openModal(cIdx, iIdx) {
        document.getElementById("editCat").value = cIdx;
        document.getElementById("editItem").value = iIdx;
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        
        if(cIdx >= 0 && iIdx >= 0) {
            let item = data[cIdx].items[iIdx];
            document.getElementById("mName").value = item.name;
            document.getElementById("mDesc").value = item.desc || "";
            document.getElementById("mPrice").value = item.price;
            document.getElementById("mImg").value = item.img || "";
            document.getElementById("imgPreview").src = item.img || "";
        } else {
            document.getElementById("mName").value = "";
            document.getElementById("mDesc").value = "";
            document.getElementById("mPrice").value = "";
            document.getElementById("mImg").value = "";
            document.getElementById("imgPreview").src = "";
        }
        document.getElementById("itemModal").style.display = "flex";
    }

    function uploadImg(e) {
        let file = e.target.files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById("mImg").value = evt.target.result;
                document.getElementById("imgPreview").src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveItem() {
        let cIdx = parseInt(document.getElementById("editCat").value);
        let iIdx = parseInt(document.getElementById("editItem").value);
        let name = document.getElementById("mName").value;
        let desc = document.getElementById("mDesc").value;
        let price = parseFloat(document.getElementById("mPrice").value);
        let img = document.getElementById("mImg").value;

        if(!name || isNaN(price)) { alert("أدخل الاسم والسعر على الأقل"); return; }

        let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        let itemObj = { name, desc, price, img };

        if(cIdx >= 0 && iIdx >= 0) {
            data[cIdx].items[iIdx] = itemObj;
        } else {
            if(data.length > 0) {
                data[0].items.push(itemObj);
            }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        document.getElementById("itemModal").style.display = "none";
        loadAdmin();
    }

    loadAdmin();
</script>
</body>
</html>
